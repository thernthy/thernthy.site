server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /sitemap.xml {
        try_files $uri =404;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
