services:
  portfolio:
    build: .
    container_name: thernthy-site
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.thernthy-site.rule=Host(`thernthy.site`) || Host(`www.thernthy.site`)
      - traefik.http.routers.thernthy-site.entrypoints=websecure
      - traefik.http.routers.thernthy-site.tls=true
      - traefik.http.routers.thernthy-site.tls.certresolver=cloudflare
      - traefik.http.services.thernthy-site.loadbalancer.server.port=80

networks:
  traefik:
    external: true
